name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ matrix.node-version }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

  test:
    name: Test (Node ${{ matrix.node-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ matrix.node-version }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  build:
    name: Build (Node ${{ matrix.node-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ matrix.node-version }}-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ matrix.node-version }}-${{ github.sha }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages and apps
        run: bun run build

  schema-drift:
    name: Schema/Migration Drift
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-22-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-22-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails if the Drizzle schema has tables/columns/indexes not captured by a
      # migration — prevents a fresh `db:migrate` from silently building a
      # partial schema (the "17 of 137 tables" trap).
      - name: Check schema/migration drift
        run: bun run db:check-drift

  route-coverage:
    name: Route Coverage (new routes must be UI-wired)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so we can diff added route files against base

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-22-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-22-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Regenerates docs/audits/route-coverage.md (informational — always
      # runs) and fails only if a brand-new route file (added vs. the PR
      # base / previous commit on main) has zero UI references anywhere in
      # apps/web, apps/mobile, or apps/desktop. Pre-existing unwired routes
      # never fail this job — see scripts/audit-route-coverage.ts.
      - name: Check new routes are UI-wired
        run: bun run audit:routes:check
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

  bundle-size:
    name: Bundle Size Gate
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ matrix.node-version }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build only the web app so we can measure its First Load JS.
      - name: Build web app
        run: bun run build
        working-directory: apps/web

      # Fails the build if the landing route's initial JS exceeds the budget.
      # Budget enforced in apps/web/scripts/check-bundle-size.mjs (CLAUDE.md
      # "THE QUALITY BAR": Initial JS bundle < 100KB — currently ratcheted to
      # the measured size until Framer Motion leaves the Hero / first-paint path).
      - name: Check bundle size
        run: bun run size
        working-directory: apps/web

  # Boots the real API against real Postgres + Redis and runs the previously
  # dormant e2e suite (apps/api/tests/e2e — CLAUDE.md issue #143: 7 files that
  # had never executed anywhere). Deliberately NOT a required status check —
  # promoting it to branch protection is an owner decision. No `|| true`
  # anywhere: a red e2e run must fail this job (issue #161's lesson).
  e2e-api:
    name: E2E API
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image, not plain postgres:16 — the migrations CREATE
        # EXTENSION vector (semantic search embeddings), which the stock
        # image cannot satisfy ("extension \"vector\" is not available").
        # Same Postgres 16 major as production.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alecrae_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alecrae_e2e
      REDIS_URL: redis://localhost:6379
      # HS256 session signing (login for the templates suite) + DKIM secret-box
      # sealing on domain create both key off JWT_SECRET. Test-only value.
      JWT_SECRET: e2e-ci-only-jwt-secret-0123456789abcdefghijklmnop
      # NOT "production": lib/env.ts's fail-fast validation (API_URL etc.) is
      # deliberately production-only and must not fire in CI.
      NODE_ENV: test
      PORT: "3001"
      E2E_API_URL: http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-22-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-22-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # packages/db/src/migrate.ts runs straight from source under Bun — no
      # build step needed before it.
      - name: Run database migrations
        run: bun run db:migrate

      - name: Seed E2E fixtures
        run: bun run scripts/seed-e2e.ts
        working-directory: apps/api

      - name: Boot API server
        run: |
          nohup bun run start > /tmp/e2e-api.log 2>&1 &
          echo $! > /tmp/e2e-api.pid
        working-directory: apps/api

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health > /dev/null 2>&1; then
              echo "API healthy after ${i} attempt(s)"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/e2e-api.pid)" 2> /dev/null; then
              echo "::error::API process exited during boot — log follows"
              cat /tmp/e2e-api.log
              exit 1
            fi
            sleep 2
          done
          echo "::error::API did not become healthy within 120s — log follows"
          cat /tmp/e2e-api.log
          exit 1

      - name: Run E2E suite
        run: bun run test:e2e
        working-directory: apps/api

      # A red run must be diagnosable from the job page alone.
      - name: Dump API log on failure
        if: failure()
        # `|| true` on the cat only: a failure BEFORE the API boots means no
        # log exists, and this diagnostic step must not mask the real error
        # with its own.
        run: cat /tmp/e2e-api.log || echo "(no API log — failure occurred before the API booted)"

      - name: Upload API log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api-log
          path: /tmp/e2e-api.log
          if-no-files-found: ignore

  gatetest:
    name: GateTest Quality Gate
    runs-on: ubuntu-latest
    needs: [test, build, bundle-size]  # only run if native tests, build and bundle gate pass
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-gatetest-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-gatetest-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build
