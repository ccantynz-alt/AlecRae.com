name: Security

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  pull_request:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun audit` against bun.lock. The previous step ran
      # `npx audit-ci ... || true`, which could never work here — audit-ci
      # requires an npm/yarn/pnpm lockfile and this is a Bun workspace, so
      # every run died on "Cannot establish package-manager type" and the
      # `|| true` reported success. The job was green while auditing nothing.
      # The gate fails on UNREVIEWED criticals only; see the script for why
      # high/moderate are reported rather than blocking.
      - name: Run dependency audit
        run: bun run scripts/check-dependency-audit.ts | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check for known vulnerabilities with OSV-Scanner
        run: |
          curl -sfL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64"
          chmod +x osv-scanner
          # Non-blocking by design (bun audit above is the gate), but the
          # output now reaches the job summary instead of being discarded —
          # `|| true` with no visible result is indistinguishable from a
          # scanner that never ran.
          ./osv-scanner --lockfile=bun.lock --recursive . | tee -a "$GITHUB_STEP_SUMMARY" || true

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
